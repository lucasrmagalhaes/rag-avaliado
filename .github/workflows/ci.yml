name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-minilm-l12-v2
      - name: Dependências
        run: pip install -r requirements.txt
      - name: Banco de teste
        run: |
          python - << 'PY'
          import psycopg
          conn = psycopg.connect("postgresql://rag:rag@localhost:5432/rag", autocommit=True)
          conn.execute("CREATE DATABASE rag_test")
          conn.close()
          PY
      - name: Testes
        env:
          TEST_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag_test
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: hash
        run: pytest
      - name: Ingestão
        env:
          DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: local
        run: python scripts/ingest.py
      - name: Avaliação e piso de qualidade
        env:
          DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: local
        run: python scripts/evaluate.py
